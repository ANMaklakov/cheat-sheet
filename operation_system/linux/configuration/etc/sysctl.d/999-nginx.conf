# Избегайте смурф-атак
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Включить защиту от плохих сообщений об ошибках ICMP
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Включите syncookies для защиты от SYN-флуд-атак
net.ipv4.tcp_syncookies = 1

# Включить и регистрировать поддельные, маршрутизированные от источника и перенаправленные пакеты
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Здесь нет пакетов, маршрутизированных источником
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Включить фильтрацию обратного пути
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Убедитесь, что никто не может изменить таблицы маршрутизации
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Не выступайте в роли маршрутизатора.
net.ipv4.ip_forward = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0


# Включить execshild
kernel.exec-shield = 1
ядро.randomize_va_space = 1

# Tuen IPv6
net.ipv6.conf.default.router_solicitations = 0
net.ipv6.conf.default.accept_ra_rtr_pref = 0
net.ipv6.conf.default.accept_ra_pinfo = 0
net.ipv6.conf.default.accept_ra_defrtr = 0
net.ipv6.conf.default.autoconf = 0
net.ipv6.conf.default.dad_transmits = 0
net.ipv6.conf.default.max_addresses = 1

# Оптимизация использования порта для LB
# Увеличить лимит дескрипторов системных файлов
fs.file-max = 65535

# Разрешить больше PID (чтобы уменьшить проблемы с переключением); может привести к сбою некоторых программ 32768
kernel.pid_max = 65536

# Увеличить ограничения системного IP-порта
net.ipv4.ip_local_port_range = 2000 65000

# Увеличьте максимальный размер буфера TCP, устанавливаемый с помощью setsockopt()
net.ipv4.tcp_rmem = 4096 87380 8388608
net.ipv4.tcp_wmem = 4096 87380 8388608

# Увеличьте пределы буфера TCP для автоматической настройки Linux
# минимальное, по умолчанию и максимальное количество байтов для использования
# установите максимум не менее 4 МБ или выше, если вы используете пути с очень высоким BDP
# TCP Windows и т. д.
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608
net.core.netdev_max_backlog = 5000
net.ipv4.tcp_window_scaling = 1
